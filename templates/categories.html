{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">ORGANIZE YOUR CATALOG</p><h1>Categories</h1><p class="muted">Group related products so they are easy to find.</p></div></div>
<div class="two-col"><section class="panel"><h2>Add a category</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Category name<input name="name" maxlength="80" placeholder="For example: Accessories" required></label><button class="button">Create category</button></form></section><section class="panel"><h2>Your categories</h2><table><thead><tr><th>ID</th><th>Name</th><th>Products</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.id }}</td><td>{{ c.name }}</td><td>{{ c.products }}</td></tr>{% else %}<tr><td colspan="3">No categories yet.</td></tr>{% endfor %}</tbody></table></section></div>{% endblock %}
