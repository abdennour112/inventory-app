{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><p class="eyebrow">PRODUCT CATALOG</p><h1>{{ 'Edit product' if product and product.id else 'Add a product' }}</h1><p class="muted">Quantities change through recorded receipts and sales.</p></div><a href="{{ url_for('dashboard') }}">← Back to inventory</a></div>
<section class="panel form-panel">{% if not categories %}<p>Create a <a href="{{ url_for('categories') }}">category</a> first.</p>{% else %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="two-col"><label>Product name<input name="name" value="{{ product.name if product else '' }}" maxlength="120" required></label><label>Unique SKU<input name="sku" value="{{ product.sku if product else '' }}" maxlength="40" required></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if product and product.category_id|int==c.id }}>{{ c.name }}</option>{% endfor %}</select></label><label>Selling price (USD)<input name="price" type="number" min="0" max="9999999.99" step="0.01" value="{{ product.price if product else '' }}" required></label><label>Low-stock threshold<input name="low_stock_threshold" type="number" min="0" max="1000000" value="{{ product.low_stock_threshold if product else 5 }}" required></label></div><button class="button">Save product</button></form>{% endif %}</section>{% endblock %}
