server {
    listen 80;
    server_name inventory.lab.test;
    return 301 https://inventory.lab.test$request_uri;
}
server {
    listen 443 ssl;
    server_name inventory.lab.test;
    ssl_certificate /etc/nginx/tls/inventory.crt;
    ssl_certificate_key /etc/nginx/tls/inventory.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    access_log /var/log/nginx/inventory-access.log;
    error_log /var/log/nginx/inventory-error.log;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
